name: Publish Glo# GitBook artifacts
description: >-
  Pre-render every glosharp fence in a GitBook Git Sync repo and write hash-keyed
  HTML artifacts for the Glo# GitBook integration to look up.
author: Glo#

inputs:
  paths:
    description: Space-separated Markdown files or directories to scan.
    required: false
    default: .
  out:
    description: Directory to write artifacts to (upload this to your static host).
    required: false
    default: glosharp-artifacts
  fence:
    description: Fence language to claim.
    required: false
    default: glosharp
  themes:
    description: Space-separated themes to render. Empty means dark + light.
    required: false
    default: ''
  framework:
    description: Target framework moniker, e.g. net10.0.
    required: false
    default: ''
  project:
    description: .csproj providing NuGet context for the snippets.
    required: false
    default: ''
  complog:
    description: .complog / .glocontext providing compilation context.
    required: false
    default: ''
  config:
    description: glosharp.config.json to load.
    required: false
    default: ''
  concurrency:
    description: Concurrent renders.
    required: false
    default: '4'
  check:
    description: Report drift and fail instead of writing (for pull requests).
    required: false
    default: 'false'
  prune:
    description: Delete artifacts that no snippet claims.
    required: false
    default: 'true'
  package-version:
    description: Version of @glosharp/gitbook to run.
    required: false
    default: latest
  glosharp-version:
    description: Version of the GloSharp.Cli dotnet tool to install. Empty means latest.
    required: false
    default: ''
  setup-dotnet:
    description: >-
      Install the .NET SDK. Set to 'false' when the workflow already did, or when
      snippets resolve entirely from a committed .glocontext.
    required: false
    default: 'true'
  dotnet-version:
    description: .NET SDK version to install when setup-dotnet is enabled.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    - name: Setup .NET
      if: inputs.setup-dotnet == 'true'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Install the glosharp CLI
      shell: bash
      # Inputs reach bash through env, never through ${{ }} interpolation:
      # interpolation splices the value into the script source, so a value
      # containing $(...) or a quote runs as code.
      env:
        GLOSHARP_VERSION: ${{ inputs.glosharp-version }}
      run: |
        if [ -n "$GLOSHARP_VERSION" ]; then
          dotnet tool install --global GloSharp.Cli --version "$GLOSHARP_VERSION"
        else
          dotnet tool install --global GloSharp.Cli
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Render snippets
      shell: bash
      env:
        GB_PATHS: ${{ inputs.paths }}
        GB_OUT: ${{ inputs.out }}
        GB_FENCE: ${{ inputs.fence }}
        GB_THEMES: ${{ inputs.themes }}
        GB_CONCURRENCY: ${{ inputs.concurrency }}
        GB_FRAMEWORK: ${{ inputs.framework }}
        GB_PROJECT: ${{ inputs.project }}
        GB_COMPLOG: ${{ inputs.complog }}
        GB_CONFIG: ${{ inputs.config }}
        GB_CHECK: ${{ inputs.check }}
        GB_PRUNE: ${{ inputs.prune }}
        GB_PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        # $GB_PATHS and $GB_THEMES are intentionally unquoted — both are
        # space-separated lists and word splitting is the point. Expansion
        # cannot execute anything either way.
        args=(build $GB_PATHS --out "$GB_OUT" --fence "$GB_FENCE")
        args+=(--concurrency "$GB_CONCURRENCY")
        for theme in $GB_THEMES; do args+=(--theme "$theme"); done
        # `if` blocks, not `[ … ] && …`: under `set -e` a false test as the last
        # command of the step would fail the step.
        if [ -n "$GB_FRAMEWORK" ]; then args+=(--framework "$GB_FRAMEWORK"); fi
        if [ -n "$GB_PROJECT" ]; then args+=(--project "$GB_PROJECT"); fi
        if [ -n "$GB_COMPLOG" ]; then args+=(--complog "$GB_COMPLOG"); fi
        if [ -n "$GB_CONFIG" ]; then args+=(--config "$GB_CONFIG"); fi
        if [ "$GB_CHECK" = "true" ]; then args+=(--check); fi
        if [ "$GB_PRUNE" = "true" ]; then args+=(--prune); fi
        npx --yes "@glosharp/gitbook@$GB_PACKAGE_VERSION" "${args[@]}"
