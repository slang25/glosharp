name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-build-and-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore test fixtures
        run: dotnet restore tests/GloSharp.Tests/fixtures/sample-project/SampleProject.csproj

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet run --project tests/GloSharp.Tests/

  node-build-and-test:
    name: Node Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w @glosharp/core
          npm run build -w @glosharp/shiki
          npm run build -w @glosharp/expressive-code
          npm run build -w @glosharp/gitbook

      - name: GitBook package tests
        run: npm test -w @glosharp/gitbook

      - name: GitBook integration typecheck
        run: npm run typecheck:integration -w @glosharp/gitbook

      - name: GitBook integration manifest check
        run: npm run gitbook:check -w @glosharp/gitbook
        env:
          GLOSHARP_GITBOOK_ORG: ci

      - name: E2E tests
        run: npm test --workspace=tests/e2e

      - name: Rendering fixture drift check
        run: npm run fixtures:check --workspace=tests/rendering

  web-rendering:
    name: Web Rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Intentionally no .NET setup: the rendering gallery and its Playwright
      # suite run entirely from committed fixtures.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w @glosharp/core
          npm run build -w @glosharp/shiki
          npm run build -w @glosharp/expressive-code
          npm run build -w @glosharp/gitbook

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: tests/rendering

      - name: Rendering invariants
        run: npm test --workspace=tests/rendering

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/rendering/playwright-report/
            tests/rendering/test-results/
          retention-days: 14
