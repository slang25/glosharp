name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact version to publish (e.g. 0.2.0-alpha.3). Leave empty to publish
          the next <preid>.N prerelease after what npm already has. Pass the same
          value to "Publish NuGet packages" to keep the CLI and npm in step.
        required: false
        default: ''
      preid:
        description: Prerelease identifier used when version is empty.
        required: false
        default: alpha

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    env:
      # Dependency order: everything else depends on @glosharp/core.
      PACKAGES: >-
        @glosharp/core
        @glosharp/shiki
        @glosharp/expressive-code
        @glosharp/gitbook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Compute version and dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREID: ${{ inputs.preid }}
        run: |
          # Semver-aware (alpha.10 > alpha.9) and fails loudly on registry errors.
          # shellcheck disable=SC2086 # PACKAGES is a space-separated list
          VERSION=$(node .github/scripts/next-version.mjs --registry npm \
            --preid "$INPUT_PREID" --version "$INPUT_VERSION" $PACKAGES)

          # Prereleases go to a tag named after their preid (alpha, beta, rc...),
          # stable releases to latest.
          case "$VERSION" in
            *-*) PRE="${VERSION#*-}"; TAG="${PRE%%.*}" ;;
            *)   TAG=latest ;;
          esac
          # npm rejects dist-tags that parse as a semver range (e.g. "0").
          case "$TAG" in [0-9]*) TAG=next ;; esac

          # Until a stable release exists, `latest` should still follow the newest
          # prerelease; otherwise a bare `npm install @glosharp/x` keeps resolving
          # whatever happened to be published first.
          ALSO_LATEST=false
          if [ "$TAG" != latest ]; then
            HAS_STABLE=$(npm view @glosharp/core versions --json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v=[];try{v=[].concat(JSON.parse(s||"[]"))}catch{};console.log(v.some(x=>!x.includes("-")))})')
            if [ "$HAS_STABLE" != true ]; then ALSO_LATEST=true; fi
          fi

          echo "Publishing $VERSION with dist-tag $TAG (also latest: $ALSO_LATEST)"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "also-latest=$ALSO_LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in $PACKAGES; do
            npm pkg set "version=$VERSION" -w "$pkg"
          done
          # Pin the internal dependency to the exact version being published.
          for pkg in @glosharp/shiki @glosharp/expressive-code @glosharp/gitbook; do
            npm pkg set "dependencies.@glosharp/core=$VERSION" -w "$pkg"
          done

      - name: Build packages
        run: npm run build

      - name: Check package tarballs
        run: node .github/scripts/check-pack.mjs

      # Skips versions that already exist, so a re-run after a partial failure
      # publishes only what is missing.
      - name: Publish packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ALSO_LATEST: ${{ steps.version.outputs.also-latest }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in $PACKAGES; do
            if [ -n "$(npm view "$pkg@$VERSION" version 2>/dev/null)" ]; then
              echo "$pkg@$VERSION already published; skipping"
            else
              npm publish -w "$pkg" --access public --provenance --tag "$TAG"
            fi
            if [ "$ALSO_LATEST" = true ]; then
              npm dist-tag add "$pkg@$VERSION" latest
            fi
          done
